epic_6_preparation_stories:
  - id: epic6-story-7.0
    title: "Story 7.0: Automated Daily Quota Reset"
    owner: "Elena (primary) + Charlie (pairing)"
    priority: "HIGH"
    blocking: "Epic 7"
    status: "pending"
    effort_estimate: "6-10 hours"
    timeline: "Week 2-3 of preparation sprint"
    story_file: "Will be created in _bmad-output/implementation-artifacts/7-0-automated-quota-reset.md"
    acceptance_criteria:
      - "YouTube quotas reset at midnight Pacific Time"
      - "Other service quotas reset at midnight UTC (or per-service config)"
      - "Reset creates new daily record with units_used = 0"
      - "Old quota records retained for 90 days"
      - "Scheduler runs reliably in Railway (cron or APScheduler)"
      - "Alert sent if reset job fails"
      - "Manual reset endpoint for ops team"
      - "Tests verify reset logic with time-mocking"
    rationale: "YouTube has strict daily quotas (10k units, resets midnight PT). Manual reset won't scale."
    notes: "Francis decided this should be a story, not action item. SM approved Elena pairing with Charlie."

# Process Improvement Commitments
weekly_check_ins:
  enabled: true
  frequency: "Sprint planning or standup"
  responsibility: "Bob (Scrum Master)"
  process:
    - "Review action-items.yaml status"
    - "Owners report progress or blockers"
    - "Escalate if 'pending' → 'in-progress' doesn't happen within 1 week"

epic_kickoff_gate:
  enabled: true
  requirement: "HIGH priority action items MUST be completed before starting next epic"
  process:
    - "Review all HIGH priority action items"
    - "Verify completion or document deferral with reasoning"
    - "Get team consensus before epic kickoff"
